name: 文档站 / Documentation Site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.en.md"
      - "CHANGELOG.md"
      - "CHANGELOG.en.md"
      - "manifest.json"
      - "docs/**"
      - "locales/en/docs/**"
      - ".github/docs-site/**"
      - ".github/mkdocs.yml"
      - ".github/requirements/docs.txt"
      - ".github/workflows/pages.yml"
      - "scripts/build-docs-site.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建 / Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码 / Check out source
        uses: actions/checkout@v4
      - name: 配置 Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/docs.txt
      - name: 安装文档依赖 / Install documentation dependencies
        run: python -m pip install --requirement .github/requirements/docs.txt
      - name: 准备双语文档源 / Prepare bilingual documentation sources
        run: python scripts/build-docs-site.py
      - name: 配置 Pages / Configure Pages
        uses: actions/configure-pages@v5
      - name: 构建站点 / Build site
        run: mkdocs build --strict --config-file .github/mkdocs.yml
      - name: 上传 Pages 制品 / Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: 部署 / Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages / Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
