name: 持续集成 / Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    name: 验证 / Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: 检出源码 / Check out source
        uses: actions/checkout@v4
      - name: 配置 Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 审计双语覆盖 / Audit bilingual coverage
        run: python scripts/localization-audit.py --strict
      - name: 检查全仓库链接 / Check repository-wide links
        run: python scripts/check-links.py --strict
      - name: 验证完整包 / Validate complete package
        run: python scripts/validate-package.py

  build:
    name: 构建双语发行包 / Build bilingual distributions
    needs: validate
    runs-on: windows-latest
    steps:
      - name: 检出源码 / Check out source
        uses: actions/checkout@v4
      - name: 配置 Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 读取受约束发行元数据 / Read constrained release metadata
        id: metadata
        shell: pwsh
        run: |
          $lines = python scripts/release-workflow.py metadata --format github
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: 构建中文包 / Build zh-CN package
        run: python scripts/build-release.py reproducible --locale zh-CN --output "${{ runner.temp }}\${{ steps.metadata.outputs.archive_zh }}" --witness "${{ runner.temp }}\${{ steps.metadata.outputs.witness_zh }}"
      - name: 构建英文包 / Build English package
        run: python scripts/build-release.py reproducible --locale en --output "${{ runner.temp }}\${{ steps.metadata.outputs.archive_en }}" --witness "${{ runner.temp }}\${{ steps.metadata.outputs.witness_en }}"
      - name: 上传候选产物 / Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-bilingual-candidate
          path: |
            ${{ runner.temp }}\${{ steps.metadata.outputs.archive_zh }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.archive_en }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.witness_zh }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.witness_en }}
          retention-days: 7
