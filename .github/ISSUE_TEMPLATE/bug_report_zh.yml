name: 缺陷报告（中文）
description: 提交可复现的缺陷与验证信息
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 感谢提交缺陷。安全问题请改用私密漏洞报告渠道。
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: 填写包版本、Codex 版本、操作系统和 Python 版本。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际结果、预期结果与影响范围。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 提供稳定、最小且不含敏感信息的复现步骤。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附命令结果、日志片段或截图，提交前移除凭据与私有路径。
  - type: textarea
    id: verification
    attributes:
      label: 已尝试的验证
      description: 列出已经执行的检查与实际结果。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 已搜索现有 Issue，未发现相同报告。
          required: true
        - label: 内容不含 Token、Cookie、API Key、密码或其他敏感信息。
          required: true
