name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "scripts/check-links.py"
      - "tests/test_repository_links.py"
      - ".github/workflows/links.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - "scripts/check-links.py"
      - "tests/test_repository_links.py"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  internal:
    name: Repository links
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check paths and anchors
        run: python scripts/check-links.py --strict

  external:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe external links
        run: python scripts/check-links.py --external --strict
