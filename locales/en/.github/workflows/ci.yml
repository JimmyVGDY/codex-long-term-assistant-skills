name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Audit bilingual coverage
        run: python scripts/localization-audit.py --strict
      - name: Check repository-wide links
        run: python scripts/check-links.py --strict
      - name: Validate complete package
        run: python scripts/validate-package.py

  build:
    name: Build bilingual distributions
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read constrained release metadata
        id: metadata
        shell: pwsh
        run: |
          $lines = python scripts/release-workflow.py metadata --format github
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build zh-CN package
        run: python scripts/build-release.py reproducible --locale zh-CN --output "${{ runner.temp }}\${{ steps.metadata.outputs.archive_zh }}" --witness "${{ runner.temp }}\${{ steps.metadata.outputs.witness_zh }}"
      - name: Build English package
        run: python scripts/build-release.py reproducible --locale en --output "${{ runner.temp }}\${{ steps.metadata.outputs.archive_en }}" --witness "${{ runner.temp }}\${{ steps.metadata.outputs.witness_en }}"
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-bilingual-candidate
          path: |
            ${{ runner.temp }}\${{ steps.metadata.outputs.archive_zh }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.archive_en }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.witness_zh }}
            ${{ runner.temp }}\${{ steps.metadata.outputs.witness_en }}
          retention-days: 7
