name: Release Candidate and Provenance

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  preflight:
    name: Check version and source
    runs-on: ubuntu-latest
    outputs:
      build_python: ${{ steps.python.outputs.python-version }}
      archive_zh: ${{ steps.metadata.outputs.archive_zh }}
      archive_en: ${{ steps.metadata.outputs.archive_en }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version-file: config/release-python-version.txt
      - name: Validate tag and package version
        id: metadata
        shell: bash
        run: python scripts/release-workflow.py metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - name: Verify tagged commit belongs to master
        if: github.ref_type == 'tag'
        shell: bash
        run: python scripts/release-workflow.py verify-master --commit HEAD --master-ref origin/master
      - name: Check version occupancy for a manual branch candidate
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-workflow.py remote-state --repository "$GITHUB_REPOSITORY"

  tag-inventory:
    name: Inspect published releases and drafts
    needs: preflight
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for draft visibility
    outputs:
      release_id: ${{ steps.lookup.outputs.release_id }}
      inventory_sha256: ${{ steps.lookup.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ needs.preflight.outputs.build_python }}"
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/release-workflow.py remote-state --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"

  validate:
    name: Pre-release validation (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [preflight, tag-inventory]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.tag-inventory.result == 'success' || (github.ref_type != 'tag' && needs.tag-inventory.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.python != '3.13'
        with:
          python-version: "${{ matrix.python }}"
      - name: Set up the shared release Python
        if: matrix.python == '3.13'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: config/release-python-version.txt
      - name: Audit bilingual coverage
        run: python scripts/localization-audit.py --strict
      - name: Check repository-wide links
        run: python scripts/check-links.py --strict
      - name: Validate complete package
        run: python scripts/validate-package.py

  platform-build:
    name: Reproduce archives (${{ matrix.os }})
    needs: [preflight, validate]
    if: "!cancelled() && needs.preflight.result == 'success' && needs.validate.result == 'success'"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ needs.preflight.outputs.build_python }}"
      - name: Capture clean release source
        shell: bash
        run: python scripts/build-release.py snapshot --require-clean --output "$RUNNER_TEMP/release-source"
      - name: Build both archives and witnesses
        env:
          ARCHIVE_ZH: ${{ needs.preflight.outputs.archive_zh }}
          ARCHIVE_EN: ${{ needs.preflight.outputs.archive_en }}
        shell: bash
        run: |
          python "$RUNNER_TEMP/release-source/scripts/build-release.py" reproducible --locale zh-CN --output "dist/platform/$ARCHIVE_ZH" --witness dist/platform/witness-zh-CN.json
          python "$RUNNER_TEMP/release-source/scripts/build-release.py" reproducible --locale en --output "dist/platform/$ARCHIVE_EN" --witness dist/platform/witness-en.json
      - name: Preserve platform evidence
        if: "!cancelled()"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-${{ matrix.os }}-${{ github.sha }}
          path: dist/platform/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  build:
    name: Compare and attest bilingual artifacts
    needs: [preflight, platform-build]
    if: "!cancelled() && needs.preflight.result == 'success' && needs.platform-build.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ needs.preflight.outputs.build_python }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-windows-latest-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-ubuntu-latest-${{ github.sha }}
          path: dist/comparison
      - name: Compare both platforms' archives
        run: python scripts/release-workflow.py compare-platforms --directory dist/release --other-directory dist/comparison
      - id: metadata
        shell: bash
        run: python scripts/release-workflow.py metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - name: Generate bilingual notes
        run: python scripts/release-workflow.py notes --output dist/release/GITHUB_RELEASE_NOTES.md
      - name: Generate GitHub build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/${{ steps.metadata.outputs.archive_zh }}
            dist/release/${{ steps.metadata.outputs.archive_en }}
      - name: Preserve attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROVENANCE: ${{ steps.metadata.outputs.provenance }}
        run: cp -- "$BUNDLE" "dist/release/$PROVENANCE"
      - name: Generate final checksums
        run: python scripts/release-workflow.py checksums --directory dist/release --output dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-attested-bilingual-candidate
          path: dist/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  draft-release:
    name: Verify an existing release or create a draft
    if: github.ref_type == 'tag'
    needs: [build, tag-inventory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.tag }}-attested-bilingual-candidate
          path: candidate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: source/config/release-python-version.txt
      - name: Read tagged release metadata
        shell: bash
        run: python source/scripts/release-workflow.py metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_ENV"
      - name: Verify downloaded candidate and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python source/scripts/release-workflow.py verify-candidate --directory candidate
          python source/scripts/build-release.py verify --archive "candidate/$archive_zh" --locale zh-CN
          python source/scripts/build-release.py verify --archive "candidate/$archive_en" --locale en
          commit=$(git -C source rev-parse 'HEAD^{commit}')
          for archive in "$archive_zh" "$archive_en"; do
            gh attestation verify "candidate/$archive" --repo "$GITHUB_REPOSITORY" --bundle "candidate/$provenance" --source-digest "$commit" --source-ref "$GITHUB_REF" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Check occupancy and reconcile all existing assets
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.tag-inventory.outputs.release_id }}
          EXPECTED_INVENTORY: ${{ needs.tag-inventory.outputs.inventory_sha256 }}
        shell: bash
        run: python source/scripts/release-workflow.py remote-state --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --directory candidate --expected-id "$EXPECTED_ID" --expected-inventory "$EXPECTED_INVENTORY" --reuse-provenance --format github >> "$GITHUB_OUTPUT"
      - name: Create and read back the draft
        if: steps.current.outputs.status == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.build.outputs.release_title }}
          COMMIT: ${{ steps.current.outputs.source_commit }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$COMMIT" --draft \
            --title "$RELEASE_TITLE" --notes-file "candidate/$release_notes" \
            "candidate/$archive_zh" "candidate/$archive_en" \
            "candidate/$witness_zh" "candidate/$witness_en" \
            "candidate/$provenance" "candidate/$checksums"
          python source/scripts/release-workflow.py remote-state --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --directory candidate --require-existing
