name: Release Candidate and Provenance

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Pre-release validation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Validate tag and package version
        run: python scripts/release-workflow.py metadata --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Audit bilingual coverage
        run: python scripts/localization-audit.py --strict
      - name: Check repository-wide links
        run: python scripts/check-links.py --strict
      - name: Validate complete package
        run: python scripts/validate-package.py

  build:
    name: Build and attest bilingual artifacts
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Read constrained release metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $lines = python scripts/release-workflow.py metadata --tag "$env:RELEASE_TAG" --format github
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Create release directory and bilingual notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          python scripts/release-workflow.py notes --output dist\release\GITHUB_RELEASE_NOTES.md
      - name: Build reproducible zh-CN package
        run: python scripts/build-release.py reproducible --locale zh-CN --output "dist\release\${{ steps.metadata.outputs.archive_zh }}" --witness "dist\release\${{ steps.metadata.outputs.witness_zh }}"
      - name: Build reproducible English package
        run: python scripts/build-release.py reproducible --locale en --output "dist\release\${{ steps.metadata.outputs.archive_en }}" --witness "dist\release\${{ steps.metadata.outputs.witness_en }}"
      - name: Generate GitHub build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/${{ steps.metadata.outputs.archive_zh }}
            dist/release/${{ steps.metadata.outputs.archive_en }}
      - name: Preserve attestation bundle
        shell: pwsh
        run: Copy-Item -LiteralPath "${{ steps.attest.outputs.bundle-path }}" -Destination "dist\release\${{ steps.metadata.outputs.provenance }}"
      - name: Generate final checksums
        run: python scripts/release-workflow.py checksums --directory dist\release --output dist\release\SHA256SUMS.txt
      - name: Upload attested release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-attested-bilingual-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create maintainer-review draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download attested release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.tag }}-attested-bilingual-candidate
          path: candidate
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Read and validate release metadata
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: python source/scripts/release-workflow.py metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_ENV"
      - name: Re-verify downloaded artifacts and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python source/scripts/release-workflow.py verify-candidate --directory candidate
          python source/scripts/build-release.py verify --archive "candidate/$archive_zh" --locale zh-CN
          python source/scripts/build-release.py verify --archive "candidate/$archive_en" --locale en
          gh attestation verify "candidate/$archive_zh" --repo "$GITHUB_REPOSITORY" --bundle "candidate/$provenance"
          gh attestation verify "candidate/$archive_en" --repo "$GITHUB_REPOSITORY" --bundle "candidate/$provenance"
      - name: Create draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TITLE: ${{ needs.build.outputs.release_title }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no assets were replaced."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TITLE" \
            --notes-file "candidate/$release_notes" \
            "candidate/$archive_zh" \
            "candidate/$archive_en" \
            "candidate/$witness_zh" \
            "candidate/$witness_en" \
            "candidate/$provenance" \
            "candidate/$checksums"
