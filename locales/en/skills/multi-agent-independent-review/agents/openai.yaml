interface:
  display_name: "Independent Multi-Agent Review"
  short_description: "Luna/Terra tiers, shared review packets, and cost-constrained review"
  default_prompt: "Use this Skill only when independent review can add material information. Generate one shared packet, start with the Luna base budget, add review-budget and valid-evidence points, then select one of ten combinations and dispatch once, capped at Astra High. Wait for the round before centralized attribution and targeted re-review."
policy:
  allow_implicit_invocation: true
